<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal – Troy Wu</title>
<meta name="description" content="Troy Wu's journal: a bit more about me, and things I've written down.">
<meta property="og:title" content="Journal – Troy Wu">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preload" href="../fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<script>
try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
if (new URLSearchParams(location.search).get('p')) document.documentElement.classList.add('reading');
</script>
<style>
/* Layout: the list of entries on the left with a note about Troy pinned beside it on the right.
   Opening an entry (?p=the-title) swaps both for one reading column.
   All the writing lives in entries.md, next to this file. */
:root {
  --paper: #ffffff;
  --ink: #000000;
  --mute: #595959;
  --font-dot: "Doto", "Courier New", monospace;
  --font-text: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-code: ui-monospace, Menlo, Consolas, monospace;
  --gutter: clamp(1rem, 3.2vw, 3rem);
  --measure: 38rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #000000; --ink: #ffffff; --mute: #a6a6a6; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #000000; --ink: #ffffff; --mute: #a6a6a6; color-scheme: dark; }

@font-face { font-family: "Doto"; src: url("../fonts/doto.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Instrument Sans"; src: url("../fonts/instrument-sans.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: var(--paper); color: var(--ink);
  font: 400 1rem/1.5 var(--font-text);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ol, figure, blockquote { margin: 0; padding: 0; }
ol.entries { list-style: none; }
a { color: inherit; text-decoration-thickness: 0.07em; text-underline-offset: 0.22em; }
a:hover { background: var(--ink); color: var(--paper); text-decoration: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
canvas { display: block; width: 100%; height: 100%; }

.bar, .page {
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-block: 1.4rem 0; }
.bar .me { font: 900 1.9rem/1 var(--font-dot); letter-spacing: -0.03em; word-spacing: -0.28em; text-decoration: none; }
.bar nav { display: flex; gap: 1.2rem; font-size: 0.9375rem; }

/* ---------- the list, with the note beside it ---------- */
.page {
  max-width: 76rem; margin-inline: auto;
  padding-block: clamp(1.5rem, 5vh, 3.5rem) 5rem;
  display: grid; grid-template-columns: minmax(0, 1fr) 19.5rem;
  grid-template-areas: "mast side" "view side";
  grid-template-rows: auto 1fr;
  column-gap: clamp(2rem, 6vw, 5.5rem); row-gap: clamp(1.8rem, 5vh, 3rem);
}
.mast { grid-area: mast; font: 900 clamp(4rem, 13vw, 6.2rem)/0.8 var(--font-dot); letter-spacing: -0.04em; margin-left: -0.05em; }
#view { grid-area: view; min-width: 0; }
.side { grid-area: side; align-self: start; position: sticky; top: 1.5rem; display: grid; gap: 0.9rem; line-height: 1.55; }
.side:empty { display: none; }
.side img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }

.entries { display: grid; gap: 2rem; }
.card { display: grid; grid-template-columns: 12.5rem minmax(0, 1fr); gap: 1.5rem; align-items: start; text-decoration: none; }
a.card:hover { background: none; color: inherit; }
a.card:hover h2 { text-decoration: underline; text-decoration-thickness: 0.07em; text-underline-offset: 0.18em; }
.cover { display: block; aspect-ratio: 4 / 3; overflow: hidden; }
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.card-text { display: grid; gap: 0.3rem; padding-top: 0.15rem; }
.when { color: var(--mute); font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.card h2 { font-size: 1.55rem; line-height: 1.18; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
.taste { color: var(--mute); max-width: 32rem; }
.soon-label { margin: 3rem 0 1.4rem; padding-top: 1.1rem; border-top: 2px solid var(--ink); font-size: 1rem; font-weight: 600; }
.soon .card h2 { font-size: 1.25rem; }
.soon .card { grid-template-columns: 7.5rem minmax(0, 1fr); gap: 1.2rem; }
.soon { gap: 1.4rem; }
.note { color: var(--mute); margin-top: 1rem; }

/* ---------- one entry: a single column, nothing beside it ---------- */
.reading .mast, .reading .side { display: none; }
.reading .page { display: block; max-width: calc(var(--measure) + 2 * var(--gutter)); padding-block: clamp(2rem, 7vh, 4.5rem) 5rem; }
.entry-head { display: grid; gap: 0.7rem; margin-bottom: 2rem; }
.entry-head h1 { font-size: clamp(2rem, 6vw, 2.9rem); line-height: 1.08; font-weight: 600; letter-spacing: -0.022em; text-wrap: balance; }
.banner { display: block; height: 7.5rem; margin-bottom: 2.4rem; overflow: hidden; }
.prose { font-size: 1.1875rem; line-height: 1.68; display: flow-root; }
.prose > * + * { margin-top: 1.25em; }
.prose > p.opening::first-letter {
  font: 900 4.4em/0.72 var(--font-dot);
  float: left; padding: 0.06em 0.12em 0 0; margin-left: -0.04em;
}
.prose h2 { font-size: 1.35em; line-height: 1.2; font-weight: 600; letter-spacing: -0.012em; margin-top: 2em; }
.prose h3 { font-size: 1.1em; line-height: 1.3; font-weight: 650; margin-top: 1.8em; }
.prose blockquote { font-size: 1.3em; line-height: 1.32; font-weight: 550; letter-spacing: -0.012em; padding-left: 1.1rem; border-left: 3px solid var(--ink); margin-block: 1.6em; }
.prose blockquote > * + * { margin-top: 0.6em; }
.prose hr { border: 0; height: 6px; width: 42px; margin: 2.6em auto; background: linear-gradient(90deg, var(--ink) 6px, transparent 6px) 0 0 / 18px 6px repeat-x; }
.prose img { display: block; max-width: 100%; height: auto; margin-inline: auto; }
.prose img + br { display: none; }
.prose img ~ em { display: block; margin-top: 0.6rem; font-size: 0.82em; line-height: 1.45; color: var(--mute); font-style: normal; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li + li { margin-top: 0.35em; }
.prose code { font: 0.86em/1.5 var(--font-code); }
.prose pre { overflow-x: auto; padding: 0.9rem 1rem; border: 1px solid var(--mute); }
.prose table { border-collapse: collapse; display: block; overflow-x: auto; }
.prose th, .prose td { text-align: left; padding: 0.3rem 0.9rem 0.3rem 0; border-bottom: 1px solid var(--mute); }
.pager { margin-top: 4rem; padding-top: 1.2rem; border-top: 2px solid var(--ink); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }
.pager a { display: grid; gap: 0.15rem; text-decoration: none; }
.pager a:hover { background: none; color: inherit; }
.pager a:hover b { text-decoration: underline; text-decoration-thickness: 0.07em; text-underline-offset: 0.18em; }
.pager b { font-weight: 600; line-height: 1.3; }
.pager .older { grid-column: 2; text-align: right; }

/* ---------- narrow screens: the note sits above the list ---------- */
@media (max-width: 900px) {
  .page { grid-template-columns: minmax(0, 1fr); grid-template-areas: "mast" "side" "view"; grid-template-rows: none; }
  .side { position: static; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 0.6rem 1.1rem; align-items: start; }
  .side p:has(> img:only-child) { grid-row: 1 / span 9; }
  .side > :not(p:has(> img:only-child)) { grid-column: 2; }
}
@media (max-width: 560px) {
  .side { grid-template-columns: minmax(0, 1fr); }
  .side p:has(> img:only-child) { grid-row: auto; max-width: 14rem; }
  .side > :not(p:has(> img:only-child)) { grid-column: 1; }
  .card { grid-template-columns: minmax(0, 1fr); gap: 0.8rem; }
  .cover { aspect-ratio: 16 / 9; }
  .soon .card { grid-template-columns: 5.5rem minmax(0, 1fr); gap: 1rem; }
  .soon .cover { aspect-ratio: 4 / 3; }
}
@media (max-height: 640px) { .side { position: static; } }
</style>
</head>
<body>
<header class="bar">
  <a class="me" href="../">Troy Wu</a>
  <nav aria-label="Journal"><a id="all" href="./" hidden>All entries</a></nav>
</header>

<main class="page">
  <h1 class="mast">Journal</h1>
  <div id="view"></div>
  <aside class="side" id="about" aria-label="About Troy"></aside>
  <noscript><p class="note">This page needs JavaScript to lay out the entries. You can read them as plain text in <a href="entries.md">entries.md</a>.</p></noscript>
</main>

<script src="marked.min.js"></script>
<script>
(function () {
  'use strict';
  var view = document.getElementById('view'), covers = [];

  /* entries.md → { about, entries: [{ title, date, body, slug, soon, cover }] }, in the order written */
  /*parse-start*/
  function parseEntries(text) {
    var lines = text.replace(/\r\n?/g, '\n').replace(/^\s*<!--[\s\S]*?-->/, '').split('\n');
    var entries = [], about = [], cur = null, fence = false, seen = {}, i, m;
    for (i = 0; i < lines.length; i++) {
      if (/^\s*(```|~~~)/.test(lines[i])) fence = !fence;
      m = fence ? null : /^#\s+(.+?)\s*#*\s*$/.exec(lines[i]);
      if (m) { cur = { title: m[1], date: '', lines: [] }; entries.push(cur); }
      else if (cur) cur.lines.push(lines[i]);
      else about.push(lines[i]);
    }
    entries = entries.filter(function (e) { return !/^draft\b/i.test(e.title); }).map(function (e) {
      var l = e.lines, k = 0, soon = /^soon\s*:\s*/i.test(e.title), title = e.title.replace(/^soon\s*:\s*/i, '');
      while (k < l.length && !l[k].trim()) k++;
      // the first line under the title is the date, unless it is clearly a sentence or a picture
      if (k < l.length && l[k].trim().length <= 40 && !/^[#>!\-*\[]/.test(l[k].trim())) { e.date = l[k].trim(); k++; }
      var body = l.slice(k).join('\n').trim();
      var pic = /^!\[([^\]]*)\]\(\s*([^)\s]+)[^)]*\)/.exec(body);   // an entry that opens with a picture uses it as its cover
      var slug = title.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'entry';
      if (seen[slug]) slug += '-' + (++seen[slug]); else seen[slug] = 1;
      return { title: title, date: e.date, body: body, slug: slug, soon: soon, cover: pic ? { alt: pic[1], src: pic[2] } : null };
    });
    return { about: about.join('\n').trim(), entries: entries };
  }
  /*parse-end*/

  function html(md) { return window.marked.parse(md, { gfm: true, breaks: true }); }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function taste(e) {                       // the first paragraph of words, as plain text, cut at a word
    var parts = e.body.split(/\n\s*\n/), box = el('div'), s = '', i;
    for (i = 0; i < parts.length && !s; i++) { box.innerHTML = html(parts[i]); if (!box.querySelector('img')) s = box.textContent.replace(/\s+/g, ' ').trim(); }
    return s.length > 190 ? s.slice(0, 190).replace(/\s+\S*$/, '') + '…' : s;
  }

  /* A cover for entries without a picture: a dot-matrix pattern unique to the title. */
  var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function drawCover(cv) {
    var w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2), g = cv.getContext('2d'), s = 2166136261, i, x, y, f;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (i = 0; i < cv.dataset.seed.length; i++) { s ^= cv.dataset.seed.charCodeAt(i); s = Math.imul(s, 16777619); }
    function rnd() { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
    var cell = 7, dot = 5, a1 = rnd() * 6.28, a2 = rnd() * 6.28, f1 = 0.05 + rnd() * 0.08, f2 = 0.03 + rnd() * 0.06, p1 = rnd() * 6.28, p2 = rnd() * 6.28;
    var cx = (0.2 + rnd() * 0.6) * w / cell, cy = (0.2 + rnd() * 0.6) * h / cell, fr = 0.12 + rnd() * 0.2, lift = 0.38 + rnd() * 0.2;
    g.fillStyle = getComputedStyle(cv).color;
    for (y = 0; y * cell < h; y++) for (x = 0; x * cell < w; x++) {
      f = Math.sin((x * Math.cos(a1) + y * Math.sin(a1)) * f1 * 6.28 + p1) + Math.sin((x * Math.cos(a2) + y * Math.sin(a2)) * f2 * 6.28 + p2) + Math.sin(Math.hypot(x - cx, y - cy) * fr);
      if (lift + f / 6 > (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16) g.fillRect(x * cell + 1, y * cell + 1, dot, dot);
    }
  }
  function cover(e, cls) {
    var box = el('span', cls || 'cover');
    if (e.cover) { var im = el('img'); im.src = e.cover.src; im.alt = ''; im.loading = 'lazy'; box.appendChild(im); }
    else { var cv = el('canvas'); cv.dataset.seed = e.slug; cv.setAttribute('aria-hidden', 'true'); if (e.soon) cv.style.color = 'var(--mute)'; box.appendChild(cv); covers.push(cv); }
    return box;
  }
  function paint() { covers.forEach(drawCover); }

  function card(e) {
    var c = el(e.soon ? 'div' : 'a', 'card'), text = el('span', 'card-text');
    if (!e.soon) c.href = '?p=' + encodeURIComponent(e.slug);
    c.appendChild(cover(e));
    if (e.date && !e.soon) text.appendChild(el('span', 'when', e.date));
    text.appendChild(el('h2', '', e.title));
    var t = taste(e); if (t) text.appendChild(el('p', 'taste', t));
    c.appendChild(text);
    var li = el('li'); li.appendChild(c); return li;
  }

  function showList(all) {
    var written = all.filter(function (e) { return !e.soon; }), soon = all.filter(function (e) { return e.soon; });
    if (!written.length && !soon.length) { view.appendChild(el('p', 'note', 'Nothing here yet. The first entry will show up once it is written.')); return; }
    if (written.length) { var ol = el('ol', 'entries'); written.forEach(function (e) { ol.appendChild(card(e)); }); view.appendChild(ol); }
    if (soon.length) {
      view.appendChild(el('h2', 'soon-label', 'Coming soon'));
      var ol2 = el('ol', 'entries soon'); soon.forEach(function (e) { ol2.appendChild(card(e)); }); view.appendChild(ol2);
    }
  }

  function showEntry(entries, i) {
    var e = entries[i], art = el('article'), head = el('header', 'entry-head'), prose = el('div', 'prose');
    if (e.date) head.appendChild(el('p', 'when', e.date));
    head.appendChild(el('h1', '', e.title));
    art.appendChild(head);
    if (!e.cover) art.appendChild(cover(e, 'banner'));
    prose.innerHTML = html(e.body);
    var kids = prose.children, k;                                // the drop cap goes on the first paragraph of words
    for (k = 0; k < kids.length; k++) {
      if (kids[k].tagName === 'P' && kids[k].querySelector('img')) continue;   // skip a picture that opens the entry
      if (kids[k].tagName === 'P' && kids[k].textContent.trim()) kids[k].classList.add('opening');
      break;
    }
    art.appendChild(prose); view.appendChild(art);
    document.title = e.title + ' – Troy Wu';
    var pager = el('nav', 'pager'); pager.setAttribute('aria-label', 'More entries');
    [[i - 1, 'newer', 'Newer'], [i + 1, 'older', 'Older']].forEach(function (p) {
      var o = entries[p[0]]; if (!o) return;
      var a = el('a', p[1]); a.href = '?p=' + encodeURIComponent(o.slug);
      a.appendChild(el('span', 'when', p[2])); a.appendChild(el('b', '', o.title));
      pager.appendChild(a);
    });
    if (pager.children.length) view.appendChild(pager);
  }

  var want = new URLSearchParams(location.search).get('p');
  if (want) document.getElementById('all').hidden = false;
  fetch('entries.md', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function (text) {
    var parsed = parseEntries(text), i;
    var written = parsed.entries.filter(function (e) { return !e.soon; });
    if (!want) {
      if (parsed.about) document.getElementById('about').innerHTML = html(parsed.about);
      showList(parsed.entries);
    } else {
      for (i = 0; i < written.length; i++) if (written[i].slug === want) break;
      if (i < written.length) showEntry(written, i);
      else {
        var p = el('p', 'note', 'That entry is not here. It may have been renamed, or it is not written yet. ');
        var a = el('a', '', 'See all entries'); a.href = './'; p.appendChild(a); view.appendChild(p);
      }
    }
    paint();
  }).catch(function () {
    view.appendChild(el('p', 'note', 'The journal did not load. Check your connection and reload the page.'));
  });

  window.addEventListener('resize', paint);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);
})();
</script>
<!-- visitor counts, no cookies: https://troywu.goatcounter.com (each entry is counted as its own page) -->
<script>window.goatcounter = { path: function (p) { var q = new URLSearchParams(location.search).get('p'); return q ? p + '?p=' + q : p; } };</script>
<script data-goatcounter="https://troywu.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
